name: adloop

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No host port: db is only reachable inside the compose network, so it
    # never collides with a local Postgres install (§2).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [adloop]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # No host port either, same reasoning as db. Etappe 1 doesn't use MinIO
    # yet (that starts in Etappe 6) — it only needs to run and be healthy.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [adloop]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: adloop-app:local
    # Migrations run under a Postgres advisory lock before the server
    # starts (§2) — safe even if `web` is ever scaled to multiple replicas.
    command: ["sh", "-c", "node dist/migrate.js && node server.js"]
    env_file: .env
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [adloop]

  worker:
    image: adloop-app:local
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      WORKER_HEALTH_PORT: "3100"
    # Only starts once web has finished migrating and is healthy — otherwise
    # it would run against an empty schema (§2).
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [adloop]

volumes:
  db_data:
  minio_data:

networks:
  adloop:
