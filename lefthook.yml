# Git-Hooks via lefthook. Aktivierung, sobald die App steht: lefthook als
# devDependency plus package.json-"prepare": "lefthook install" — oder manuell
# `npx lefthook install`. Alles delegiert an scripts/; ohne package.json sind
# Secrets-Scan und Quote-Fix trotzdem aktiv, der Rest ist ein No-op.
pre-commit:
  parallel: false
  commands:
    secrets:
      run: bash scripts/verify.sh secrets
    german-quotes:
      # Auto-Fix statt Fehler; stage_fixed uebernimmt die Korrektur in den Commit.
      glob: "*.{md,mdx,ts,tsx,js,jsx,html}"
      run: node scripts/check-quotes.mjs --fix {staged_files}
      stage_fixed: true
    verify-quick:
      glob: "*.{ts,tsx,js,jsx,mjs,css}"
      run: bash scripts/verify.sh quick

pre-push:
  commands:
    verify-full:
      run: bash scripts/verify.sh full
