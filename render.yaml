# Render Blueprint für adloop (SPEC.md §7b).
# Ein Web Service als echter Node-Prozess; Secrets werden nie hier eingetragen,
# sondern als sync:false-Platzhalter über das Dashboard bzw. die API gesetzt.
services:
  - type: web
    name: adloop
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: ADLOOP_ADMIN_SECRET
        sync: false
      - key: MODEL_STRATEGIST
        sync: false
      - key: MODEL_COPY
        sync: false
      - key: FAL_MODEL_ID
        sync: false
